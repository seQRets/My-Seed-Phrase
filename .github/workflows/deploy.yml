name: Deploy to GitHub Pages

# Pages currently deploys straight from the main branch, so a push IS a
# deploy and a page that fails its own checks still goes live. This deploys
# only after verify.yml's checks pass on the same commit, so a failing page
# cannot reach myseedphrase.app.
#
# ONE-TIME SETUP, by a repository admin, before this can take effect:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Until then the deploy job fails harmlessly (Pages still serves the branch).
# The site is the repository root; only the files a visitor needs are
# published — not .git, not the harness, not the docs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/update-csp-hashes.mjs --check
      - env:
          CHROME: /usr/bin/google-chrome
        run: node verify.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage only what the site serves
        run: |
          mkdir -p _site/.well-known
          cp index.html CNAME .nojekyll _site/
          cp .well-known/security.txt _site/.well-known/
          cp BIP-39-logo.svg _site/ 2>/dev/null || true
          ls -laR _site
      # include-hidden-files: from v4 this action leaves out every file or
      # folder whose name starts with a dot, and .well-known is one. Without it
      # the deploy published no security.txt, and still reported success.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # A deploy reports success whatever it published, so ask the site itself:
      # this commit's page, byte for byte, and the security contact beside it.
      - name: The live site serves this commit's page and its security.txt
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${URL%/}"
          want=$(sha256sum _site/index.html | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -fsSL "$base/?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1)
            sec=$(curl -s -o /dev/null -w '%{http_code}' "$base/.well-known/security.txt?v=$GITHUB_SHA")
            if [ "$got" = "$want" ] && [ "$sec" = 200 ]; then echo "live: page $got, security.txt $sec"; exit 0; fi
            echo "waiting: page ${got:0:12}, security.txt $sec"; sleep 15
          done
          echo "::error::$base does not serve this commit's page and its security.txt"
          exit 1
